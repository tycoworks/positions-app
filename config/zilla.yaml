# Serves the live_pnl topic as server-sent events at GET /live_pnl. A new stream gets each instrument's
# latest row from Zilla's cache of the topic, then every change as Materialize writes it.
# The broker comes from KAFKA_BOOTSTRAP_SERVER (host:port).
name: positions-app
bindings:
  # HTTP in
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port: 7114
    exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              accept: text/event-stream
        exit: north_sse_server
  north_sse_server:
    type: sse
    kind: server
    exit: north_sse_kafka_mapping
  north_sse_kafka_mapping:
    type: sse-kafka
    kind: proxy
    routes:
      - when:
          - path: /live_pnl
        exit: north_kafka_cache_client
        with:
          topic: live_pnl
  # Kafka out, through a local cache of the topic
  north_kafka_cache_client:
    type: kafka
    kind: cache_client
    exit: south_kafka_cache_server
  south_kafka_cache_server:
    type: kafka
    kind: cache_server
    options:
      bootstrap:
        - live_pnl
    exit: south_kafka_client
  south_kafka_client:
    type: kafka
    kind: client
    options:
      servers:
        - ${{env.KAFKA_BOOTSTRAP_SERVER}}
    exit: south_tcp_client
  south_tcp_client:
    type: tcp
    kind: client
