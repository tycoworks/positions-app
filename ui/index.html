<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Positions</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #positions-grid, #trades-grid {
      flex: 1;
      overflow: hidden;
    }
    .grid-title {
      padding: 8px;
      background: #f0f0f0;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }
  </style>
</head>
<body>
  <div class="grid-title">Positions</div>
  <div id="positions-grid"></div>
  <div class="grid-title" id="trades-title">Trades</div>
  <div id="trades-grid"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
